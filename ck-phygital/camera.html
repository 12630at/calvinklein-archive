<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Calvin Klein · Instagram Camera</title>
  <meta name="theme-color" content="#000000" />

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/three-addons/"
      }
    }
  </script>

  <style>
    @font-face { font-family:"Klein"; src:url("fonts/Klein-Medium.woff2") format("woff2"); font-weight:500; font-display:swap; }
    @font-face { font-family:"Klein"; src:url("fonts/Klein-Light.woff2")  format("woff2"); font-weight:300; font-display:swap; }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html, body { height:100%; background:#000; overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }

    .stage { position:relative; width:100vw; height:100vh; max-width:390px; max-height:844px;
      margin:0 auto; background:#000; overflow:hidden; }
    @media (min-width:430px){
      body{ display:flex; align-items:center; justify-content:center; }
      .stage{ border-radius:38px; border:10px solid #000; box-shadow:0 30px 80px rgba(0,0,0,.6); }
    }

    /* MindAR mette qui video + canvas + cssRenderer */
    #ar { position:absolute; inset:0; z-index:1; }
    #ar video, #ar canvas, #ar > div { position:absolute!important; inset:0!important; width:100%!important; height:100%!important; }
    #ar video, #ar canvas { object-fit:cover!important; }

    .scrim-top { position:absolute; top:0; left:0; right:0; height:120px; z-index:2;
      background:linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0)); pointer-events:none; }
    .scrim-bot { position:absolute; bottom:0; left:0; right:0; height:230px; z-index:2;
      background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); pointer-events:none; }

    /* ============ Instagram camera chrome ============ */
    .ig { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; justify-content:space-between;
      transition:opacity .6s ease; }
    .ig.dim { opacity:0; pointer-events:none; }
    .ig-top { display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px 0; }
    .ig-top .right { display:flex; flex-direction:column; gap:22px; align-items:center; padding-top:2px; }
    .icbtn { width:26px; height:26px; display:grid; place-items:center; color:#fff; background:none; border:none;
      filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
    .icbtn svg{ width:26px; height:26px; } .ig-top .close svg{ width:24px; height:24px; }
    .ig-bottom { position:relative; padding-bottom:18px; }
    .filter-label { text-align:center; color:#fff; margin-bottom:12px; filter:drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
    .filter-label b { display:block; font-size:14px; font-weight:600; }
    .filter-label span { display:inline-block; font-size:12px; opacity:.85; margin-top:2px; }
    .tray { position:relative; height:96px; display:flex; align-items:center; justify-content:center; }
    .effects { display:flex; align-items:center; gap:12px; }
    .eff { width:36px; height:36px; border-radius:50%; flex:0 0 auto; overflow:hidden;
      background:#3a3a3a center/cover no-repeat; border:1.5px solid rgba(255,255,255,.35); opacity:.92; }
    .shutter { position:relative; width:74px; height:74px; flex:0 0 auto; border:none; background:none; }
    .shutter .ring { position:absolute; inset:0; border-radius:50%; padding:3px;
      background:conic-gradient(from 0deg,#f09433,#dc2743,#bc1888,#f09433);
      -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
              mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
    .shutter .core { position:absolute; inset:7px; border-radius:50%; overflow:hidden; border:3px solid #000;
      background:#222 center/cover no-repeat; box-shadow:0 0 0 3px #fff; }
    .shutter .core img{ width:100%; height:100%; object-fit:cover; }
    .gallery { position:absolute; left:22px; top:50%; transform:translateY(-50%); width:34px; height:34px;
      border-radius:9px; overflow:hidden; border:1.5px solid rgba(255,255,255,.7); background:#333 center/cover; }
    .gallery img{ width:100%; height:100%; object-fit:cover; }
    .flip { position:absolute; right:22px; top:50%; transform:translateY(-50%); width:34px; height:34px;
      color:#fff; background:none; border:none; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
    .flip svg{ width:32px; height:32px; }
    .modes { display:flex; align-items:center; justify-content:center; gap:22px; margin-top:14px;
      color:#fff; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    .modes span{ opacity:.6; } .modes span.on{ opacity:1; font-weight:700; }

    .hint { position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:4;
      background:rgba(0,0,0,.45); color:#fff; font-size:12.5px; padding:8px 14px; border-radius:18px;
      backdrop-filter:blur(6px); white-space:nowrap; transition:opacity .6s ease; }
    .hint.hide{ opacity:0; }

    /* ============ AR text "discover" (in CSS3D oppure overlay desktop) ============ */
    .ar-text {
      width:260px; text-align:center; opacity:0; transition:opacity .6s ease, transform .6s cubic-bezier(.2,.9,.25,1.2);
      transform:translateY(14px);
    }
    .ar-text.in { opacity:1; transform:translateY(0); }
    .ar-text .bubble {
      display:inline-block; background:rgba(255,255,255,.96); color:#000; font-family:"Klein",serif; font-weight:500;
      font-size:15px; letter-spacing:.13em; text-transform:uppercase; padding:14px 24px; border-radius:30px;
      box-shadow:0 10px 40px rgba(0,0,0,.55); white-space:nowrap; cursor:pointer;
    }
    .ar-text .bubble:active { transform:scale(.97); }
    /* quando è overlay desktop (non CSS3D) */
    .ar-text.overlay { position:absolute; left:50%; top:34%; margin-left:-130px; z-index:7; }

    .sim { position:absolute; inset:0; z-index:5; display:none; }
    .sim.on { display:block; }
    .sim img { width:100%; height:100%; object-fit:cover; }

    .gate{ position:absolute; inset:0; z-index:12; display:none; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; color:#fff; background:#000; padding:0 38px; gap:16px; }
    .gate.on{ display:flex; }
    .gate .ph{ font-size:42px; } .gate h2{ font-family:"Klein",serif; font-weight:300; font-size:18px; text-transform:uppercase; letter-spacing:.18em; }
    .gate p{ font-size:13px; line-height:1.55; color:#bbb; max-width:270px; }
    .gate button{ margin-top:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.4); color:#fff;
      font-family:"Klein",serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; padding:11px 20px; border-radius:30px; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="ar"></div>
    <div class="scrim-top"></div>
    <div class="scrim-bot"></div>

    <div class="sim" id="sim"><img src="assets/print_1999_ss_adv_print_jeans_001.jpg" alt=""></div>

    <!-- Instagram camera chrome -->
    <div class="ig" id="ig">
      <div class="ig-top">
        <button class="icbtn close" id="closeBtn" aria-label="Chiudi">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
        <div class="right">
          <button class="icbtn" aria-label="Flash"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></button>
          <button class="icbtn" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg></button>
        </div>
      </div>
      <div class="ig-bottom">
        <div class="filter-label"><b>Calvin Klein Archive</b><span>@calvinklein</span></div>
        <div class="tray">
          <div class="gallery"><img src="assets/blur_print_1999_ss_adv_print_jeans_001.jpg" alt=""></div>
          <div class="effects">
            <div class="eff" style="background:#5a4a44"></div>
            <div class="eff" style="background:#3d4b55"></div>
            <button class="shutter" aria-label="Effetto attivo"><span class="ring"></span><span class="core"><img src="assets/blur_print_1999_ss_adv_print_jeans_001.jpg" alt=""></span></button>
            <div class="eff" style="background:#4a4a4a"></div>
            <div class="eff" style="background:#6a5a4a"></div>
          </div>
          <button class="flip" aria-label="Cambia camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a6 6 0 0 1 10-2l2 2M21 16a6 6 0 0 1-10 2l-2-2"/><path d="M15 6h2.5V3.5M9 18H6.5V20.5"/></svg>
          </button>
        </div>
        <div class="modes"><span>Post</span><span class="on">Storia</span><span>Reel</span><span>Live</span></div>
      </div>
    </div>

    <div class="hint" id="hint">Inquadra il print Calvin Klein</div>

    <!-- testo AR (verrà ancorato sopra la campagna in CSS3D; su desktop diventa overlay) -->
    <div class="ar-text" id="arText">
      <span class="bubble" id="discoverBtn">Click to discover the archive</span>
    </div>

    <div class="gate" id="gate">
      <div class="ph">📱</div>
      <h2>Esperienza AR</h2>
      <p>La fotocamera è disponibile solo da smartphone. Apri questa pagina dal
         telefono e inquadra il print Calvin Klein.</p>
      <button id="demoAlt">▶ Anteprima</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from './vendor/mindar-image-three.prod.js';
    import { CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

    const ARCHIVE_URL = "../index.html?archive=1";
    const MIND_URL    = "assets/blur_print_1999_ss_adv_print_jeans_001.mind";
    const SHARP_IMG   = "assets/print_1999_ss_adv_print_jeans_001.jpg";
    const BLUR_IMG    = "assets/blur_print_1999_ss_adv_print_jeans_001.jpg";
    const PLANE_W = 1, PLANE_H = 0.625;          // ratio target 1.6:1
    const TEXT_DELAY = 1400;                       // ritardo comparsa testo dopo il reveal

    const $ = (id) => document.getElementById(id);
    const ui = { ig:$('ig'), hint:$('hint'), arText:$('arText'), discoverBtn:$('discoverBtn'),
                 gate:$('gate'), demoAlt:$('demoAlt'), sim:$('sim'), close:$('closeBtn') };

    const goArchive = () => { window.location.href = ARCHIVE_URL; };
    ui.discoverBtn.addEventListener('click', goArchive);
    ui.close.addEventListener('click', goArchive);

    // ---- fotocamera a risoluzione massima: MindAR chiede solo {facingMode}, qui aggiungo l'ideale alto ----
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = (c) => {
        if (c && c.video && typeof c.video === 'object') {
          c.video.width     = { ideal: 1920, max: 1920 };
          c.video.height    = { ideal: 1080, max: 1080 };
          c.video.frameRate = { ideal: 30 };
        }
        return orig(c);
      };
    }

    let found = false, revealStart = null;
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const clamp01 = (v) => Math.max(0, Math.min(1, v));

    function showText() { setTimeout(() => ui.arText.classList.add('in'), TEXT_DELAY); }

    function onFound() {
      if (found) return; found = true;
      if (navigator.vibrate) navigator.vibrate(60);
      ui.hint.classList.add('hide');
      ui.ig.classList.add('dim');     // sfuma la chrome, resta l'AR
      revealStart = performance.now();
      showText();
    }
    window.__onFound = onFound;        // per test / anteprima

    function isMobileDevice() {
      const ua = navigator.userAgent || '';
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua)
        || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
    }

    async function startAR() {
      const mindar = new MindARThree({
        container: $('ar'),
        imageTargetSrc: MIND_URL,
        uiScanning: 'no', uiLoading: 'no', uiError: 'no',
        filterMinCF: 0.0001, filterBeta: 0.001,
      });
      const { renderer, cssRenderer, scene, cssScene, camera } = mindar;

      // --- anchor immagine: crossfade sfocato -> nitido (animazione reveal) ---
      const anchor = mindar.addAnchor(0);
      const loader = new THREE.TextureLoader();
      const mk = (url) => { const t = loader.load(url); t.encoding = THREE.sRGBEncoding; return t; };
      const matBlur  = new THREE.MeshBasicMaterial({ map: mk(BLUR_IMG),  transparent:true, opacity:0 });
      const matSharp = new THREE.MeshBasicMaterial({ map: mk(SHARP_IMG), transparent:true, opacity:0 });
      const geo = new THREE.PlaneGeometry(PLANE_W, PLANE_H);
      const planeBlur  = new THREE.Mesh(geo, matBlur);
      const planeSharp = new THREE.Mesh(geo, matSharp);
      planeSharp.position.z = 0.002;
      anchor.group.add(planeBlur, planeSharp);

      anchor.onTargetFound = onFound;

      // --- anchor CSS: testo AR sopra la campagna ---
      const cssAnchor = mindar.addCSSAnchor(0);
      const cssObj = new CSS3DObject(ui.arText);
      cssObj.position.set(0, PLANE_H/2 + 0.16, 0.02);   // sopra il bordo alto della campagna
      cssObj.scale.setScalar(0.0026);                    // px -> unità mondo
      cssAnchor.group.add(cssObj);

      await mindar.start();

      renderer.setAnimationLoop(() => {
        if (revealStart !== null) {
          const t = clamp01((performance.now() - revealStart) / 1600);
          const e = easeOutCubic(t);
          matBlur.opacity  = clamp01(t / 0.18);                 // appare subito (soft)
          matSharp.opacity = clamp01((t - 0.18) / 0.82);        // dissolve verso il nitido
          const s = 1 + 0.05 * (1 - e);                          // 1.05 -> 1.0
          planeBlur.scale.setScalar(s); planeSharp.scale.setScalar(s);
        }
        renderer.render(scene, camera);
        cssRenderer.render(cssScene, camera);
      });
    }

    // anteprima desktop (no AR): mostra il nitido + testo overlay
    function simulate() {
      ui.gate.classList.remove('on');     // togli il gate per mostrare l'anteprima
      ui.sim.classList.add('on');
      ui.arText.classList.add('overlay');
      onFound();
    }
    ui.demoAlt.addEventListener('click', simulate);

    async function init() {
      if (!isMobileDevice()) {
        ui.ig.style.display = 'none';
        ui.gate.classList.add('on');
        return;
      }
      setTimeout(() => ui.hint.classList.add('hide'), 4000);
      try { await startAR(); }
      catch (e) {
        ui.hint.textContent = "Consenti l'accesso alla fotocamera, poi ricarica.";
        ui.hint.classList.remove('hide');
        console.error('AR error:', e);
      }
    }
    init();
  </script>
</body>
</html>
