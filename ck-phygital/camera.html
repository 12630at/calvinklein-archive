<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Calvin Klein · Instagram Camera</title>
  <meta name="theme-color" content="#000000" />

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/three-addons/"
      }
    }
  </script>

  <style>
    @font-face { font-family:"Klein"; src:url("fonts/Klein-Medium.woff2") format("woff2"); font-weight:500; font-display:swap; }
    @font-face { font-family:"Klein"; src:url("fonts/Klein-Light.woff2")  format("woff2"); font-weight:300; font-display:swap; }
    @font-face { font-family:"Klein"; src:url("fonts/Klein-Book.woff2")   format("woff2"); font-weight:400; font-display:swap; } /* CTA */

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html, body { height:100%; background:#000; overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }

    /* pieno schermo su mobile, mockup telefono solo su desktop */
    .stage { position:relative; width:100vw; height:100vh; height:100dvh;
      margin:0 auto; background:#000; overflow:hidden; }
    @media (min-width:760px) and (hover:hover){
      body{ display:flex; align-items:center; justify-content:center; }
      .stage{ width:390px; height:844px; border-radius:38px; border:10px solid #000; box-shadow:0 30px 80px rgba(0,0,0,.6); }
    }

    #ar { position:absolute; inset:0; z-index:1; }
    #ar video, #ar canvas { position:absolute!important; inset:0!important; width:100%!important; height:100%!important; }
    #ar video  { z-index:0!important; object-fit:cover!important; transition:filter .75s ease-in; } /* feed camera dietro */
    #ar canvas { z-index:2!important; object-fit:cover!important; }                                /* foto/CTA in AR davanti */

    /* sovraesposizione high-key: l'ambiente attorno alla foto si "brucia" verso il bianco */
    .whiteout { position:absolute; inset:0; z-index:1; background:#fff; opacity:0; pointer-events:none; will-change:opacity; }

    .scrim-top { position:absolute; top:0; left:0; right:0; height:120px; z-index:3;
      background:linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0)); pointer-events:none; transition:opacity .7s ease; }
    .scrim-bot { position:absolute; bottom:0; left:0; right:0; height:230px; z-index:3;
      background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); pointer-events:none; transition:opacity .7s ease; }
    body.revealed .scrim-top, body.revealed .scrim-bot { opacity:0; }

    /* ============ Instagram camera chrome ============ */
    .ig { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; justify-content:space-between;
      transition:opacity .6s ease; }
    .ig.dim { opacity:0; pointer-events:none; }
    .ig-top { display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px 0; }
    .ig-top .right { display:flex; flex-direction:column; gap:22px; align-items:center; padding-top:2px; }
    .icbtn { width:26px; height:26px; display:grid; place-items:center; color:#fff; background:none; border:none;
      filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
    .icbtn svg{ width:26px; height:26px; } .ig-top .close svg{ width:24px; height:24px; }
    .ig-bottom { position:relative; padding-bottom:18px; }
    .filter-label { text-align:center; color:#fff; margin-bottom:12px; filter:drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
    .filter-label b { display:block; font-size:14px; font-weight:600; }
    .filter-label span { display:inline-block; font-size:12px; opacity:.85; margin-top:2px; }
    .tray { position:relative; height:96px; display:flex; align-items:center; justify-content:center; }
    .effects { display:flex; align-items:center; gap:12px; }
    .eff { width:36px; height:36px; border-radius:50%; flex:0 0 auto; overflow:hidden;
      background:#3a3a3a center/cover no-repeat; border:1.5px solid rgba(255,255,255,.35); opacity:.92; }
    .shutter { position:relative; width:74px; height:74px; flex:0 0 auto; border:none; background:none; }
    .shutter .ring { position:absolute; inset:0; border-radius:50%; padding:3px;
      background:conic-gradient(from 0deg,#f09433,#dc2743,#bc1888,#f09433);
      -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
              mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
    .shutter .core { position:absolute; inset:7px; border-radius:50%; overflow:hidden; border:3px solid #000;
      background:#222 center/cover no-repeat; box-shadow:0 0 0 3px #fff; }
    .shutter .core img{ width:100%; height:100%; object-fit:cover; }
    .gallery { position:absolute; left:22px; top:50%; transform:translateY(-50%); width:34px; height:34px;
      border-radius:9px; overflow:hidden; border:1.5px solid rgba(255,255,255,.7); background:#333 center/cover; }
    .gallery img{ width:100%; height:100%; object-fit:cover; }
    .flip { position:absolute; right:22px; top:50%; transform:translateY(-50%); width:34px; height:34px;
      color:#fff; background:none; border:none; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
    .flip svg{ width:32px; height:32px; }
    .modes { display:flex; align-items:center; justify-content:center; gap:22px; margin-top:14px;
      color:#fff; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    .modes span{ opacity:.6; } .modes span.on{ opacity:1; font-weight:700; }

    .hint { position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:5;
      background:rgba(0,0,0,.45); color:#fff; font-size:12.5px; padding:8px 14px; border-radius:18px;
      backdrop-filter:blur(6px); white-space:nowrap; transition:opacity .6s ease; }
    .hint.hide{ opacity:0; }

    /* hint "esplora" nel mondo 360 */
    .lookhint { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); z-index:6;
      background:rgba(0,0,0,.30); color:#111; font-size:12px; letter-spacing:.04em; padding:8px 16px; border-radius:18px;
      opacity:0; pointer-events:none; transition:opacity .6s ease; white-space:nowrap; }
    .lookhint.show{ opacity:.55; }

    /* CTA 2D (font Klein, peso Book) — riemerge dopo il reveal */
    .cta2d { position:absolute; left:50%; bottom:118px; z-index:7;
      transform:translateX(-50%) translateY(14px); opacity:0; pointer-events:none;
      transition:opacity .8s ease, transform .8s ease;
      font-family:"Klein",sans-serif; font-weight:400; font-size:15px; letter-spacing:.14em; text-transform:uppercase;
      color:#111; background:rgba(255,255,255,.92); border:none; border-radius:30px; padding:14px 26px;
      box-shadow:0 6px 24px rgba(0,0,0,.25); cursor:pointer; }
    .cta2d.show { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }

    .gate{ position:absolute; inset:0; z-index:12; display:none; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; color:#fff; background:#000; padding:0 38px; gap:16px; }
    .gate.on{ display:flex; }
    .gate .ph{ font-size:42px; } .gate h2{ font-family:"Klein",serif; font-weight:300; font-size:18px; text-transform:uppercase; letter-spacing:.18em; }
    .gate p{ font-size:13px; line-height:1.55; color:#bbb; max-width:270px; }
    .gate button{ margin-top:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.4); color:#fff;
      font-family:"Klein",serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; padding:11px 20px; border-radius:30px; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="ar"><div class="whiteout" id="whiteout"></div></div>
    <div class="scrim-top"></div>
    <div class="scrim-bot"></div>

    <div class="ig" id="ig">
      <div class="ig-top">
        <button class="icbtn close" id="closeBtn" aria-label="Chiudi">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
        <div class="right">
          <button class="icbtn" aria-label="Flash"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></button>
          <button class="icbtn" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg></button>
        </div>
      </div>
      <div class="ig-bottom">
        <div class="filter-label"><b>Calvin Klein Archive</b><span>@calvinklein</span></div>
        <div class="tray">
          <div class="gallery"><img src="assets/blur_print_1999_ss_adv_print_jeans_001.jpg" alt=""></div>
          <div class="effects">
            <div class="eff" style="background:#5a4a44"></div>
            <div class="eff" style="background:#3d4b55"></div>
            <button class="shutter" aria-label="Effetto attivo"><span class="ring"></span><span class="core"><img src="assets/blur_print_1999_ss_adv_print_jeans_001.jpg" alt=""></span></button>
            <div class="eff" style="background:#4a4a4a"></div>
            <div class="eff" style="background:#6a5a4a"></div>
          </div>
          <button class="flip" aria-label="Cambia camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a6 6 0 0 1 10-2l2 2M21 16a6 6 0 0 1-10 2l-2-2"/><path d="M15 6h2.5V3.5M9 18H6.5V20.5"/></svg>
          </button>
        </div>
        <div class="modes"><span>Post</span><span class="on">Storia</span><span>Reel</span><span>Live</span></div>
      </div>
    </div>

    <div class="hint" id="hint">Inquadra il print Calvin Klein</div>
    <div class="lookhint" id="lookhint">Muovi il telefono per esplorare l'archivio 360°</div>

    <button class="cta2d" id="cta">Discover the archive</button>

    <div class="gate" id="gate">
      <div class="ph">📱</div>
      <h2>Esperienza AR</h2>
      <p>La fotocamera è disponibile solo da smartphone. Apri questa pagina dal
         telefono e inquadra il print Calvin Klein.</p>
      <button id="demoAlt">▶ Anteprima</button>
    </div>
  </div>

  <!-- dimensioni dell'archivio (definisce ARCHIVE_DIMS) per costruire i path delle campagne -->
  <script src="../archive_dims.js"></script>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from './vendor/mindar-image-three.prod.js';

    const ARCHIVE_URL = "../index.html?archive=1";
    const MIND_URL    = "assets/blur_print_1999_ss_adv_print_jeans_001.mind";
    const SHARP_IMG   = "assets/print_1999_ss_adv_print_jeans_001.jpg";

    // le campagne d'archivio fluttuanti vengono pescate a caso da archive_index.csv
    const ARCHIVE_BASE = "../assets/index";
    const N_CAMPAIGNS  = 80;     // quante foto sparse nel mondo 360
    const CAMP_R       = 7.5;    // raggio (shell unica -> distribuzione uniforme, niente sovrapposizioni)

    const D_PHOTO    = 3.2;    // distanza della foto rivelata
    const PHOTO_W    = 1.7;    // larghezza foto (aspect 1.6:1 -> h=1.0625)
    const RECOG_DELAY = 2200;  // attesa dopo il riconoscimento, prima di far partire l'animazione
    const BURST_MS   = 850;    // glow 3D che si proietta dai bordi della foto verso la camera
    const DEBLUR_MS  = 1150;   // deblur della foto una volta ancorata all'ambiente
    const CTA_GAP    = 1500;   // attesa dopo il reveal, prima della CTA 2D

    const $ = (id) => document.getElementById(id);
    const stage = $('stage');
    const ui = { ig:$('ig'), hint:$('hint'), lookhint:$('lookhint'), cta:$('cta'),
                 gate:$('gate'), demoAlt:$('demoAlt'), close:$('closeBtn'), whiteout:$('whiteout') };

    const goArchive = () => { window.location.href = ARCHIVE_URL; };
    ui.close.addEventListener('click', goArchive);
    ui.cta.addEventListener('click', goArchive);

    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const clamp01 = (v) => Math.max(0, Math.min(1, v));

    function isMobileDevice() {
      const ua = navigator.userAgent || '';
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua)
        || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
    }

    // fotocamera ad alta risoluzione per lo scan del target
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = (c) => {
        if (c && c.video && typeof c.video === 'object') {
          c.video.width = { ideal: 1920, max: 1920 };
          c.video.height = { ideal: 1080, max: 1080 };
          c.video.frameRate = { ideal: 30 };
        }
        return orig(c);
      };
    }

    // ---------- stato mondo 360 ----------
    let phase = 'scan';               // 'scan' | 'burst' | 'world'
    let renderer, worldScene, worldCam, scanScene = null;
    let centerGroup, photoMesh, glowMesh, revealMat, ctaShown = false;
    let worldT0 = 0, burstT0 = 0, previewMode = false;
    const campMats = [];      // materiali campagne (per il fade-in)
    const campMeshes = [];    // mesh campagne (float + click -> item view)

    // look-around: SOLO giroscopio (su desktop auto-rotazione in anteprima)
    let yaw = 0, downX = 0, downY = 0, isDrag = false;
    let gyroActive = false, gAlpha = 0, gBeta = 0, gGamma = 0, gOrient = 0, gyroRefInv = null;
    const tmpEuler = new THREE.Euler();
    const zee = new THREE.Vector3(0, 0, 1);
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const tmpQ = new THREE.Quaternion(), tmpQ2 = new THREE.Quaternion(), curQ = new THREE.Quaternion();
    const ray = new THREE.Raycaster();

    // carica una texture ridimensionata (max 768px) -> poca memoria GPU su mobile
    function loadTex(url) {
      return new Promise((resolve) => {
        const img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = () => {
          const max = 512, s = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.round(img.width * s), h = Math.round(img.height * s);
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          const t = new THREE.CanvasTexture(cv); t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
          resolve(t);
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    // pesca a caso N campagne dall'indice dell'archivio (path + stem per il deep-link)
    async function loadCampaignPool() {
      const DIMS = (typeof ARCHIVE_DIMS !== 'undefined') ? ARCHIVE_DIMS : {};
      try {
        const txt = await (await fetch('../archive_index.csv')).text();
        const lines = txt.trim().split(/\r?\n/);
        const h = lines.shift().split(',');
        const iF = h.indexOf('filename'), iC = h.indexOf('category'), iS = h.indexOf('subcategory'), iY = h.indexOf('year');
        const pool = [];
        for (const ln of lines) {
          const c = ln.split(','); const fn = c[iF]; const d = DIMS[fn];
          if (!d) continue;
          const ext = d[2] || 'webp'; if (ext === 'mp4') continue;   // niente video sul muro 360
          const path = c[iS] ? `${ARCHIVE_BASE}/${c[iC]}/${c[iS]}/${c[iY]}/${fn}.${ext}`
                             : `${ARCHIVE_BASE}/${c[iC]}/${c[iY]}/${fn}.${ext}`;
          pool.push({ path, stem: fn, a: d[0] / d[1] });
        }
        for (let i = pool.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
        return pool;
      } catch (e) { console.error('campaign pool error:', e); return []; }
    }

    // texture "cornice" luminosa: bagliore solo dai bordi, trasparente al centro
    // -> il glow si origina dai margini della foto (non un flash generale)
    function makeEdgeGlowTex() {
      const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
      const g = c.getContext('2d');
      const band = s * 0.42;                       // quanto rientra il bagliore dai bordi
      g.globalCompositeOperation = 'lighter';      // i quattro lati si sommano negli angoli
      const edge = (x0, y0, x1, y1) => {
        const grd = g.createLinearGradient(x0, y0, x1, y1);
        grd.addColorStop(0, 'rgba(255,255,255,1)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        return grd;
      };
      g.fillStyle = edge(0, 0, 0, band);           g.fillRect(0, 0, s, band);          // alto
      g.fillStyle = edge(0, s, 0, s - band);       g.fillRect(0, s - band, s, band);   // basso
      g.fillStyle = edge(0, 0, band, 0);           g.fillRect(0, 0, band, s);          // sinistra
      g.fillStyle = edge(s, 0, s - band, 0);       g.fillRect(s - band, 0, band, s);   // destra
      return new THREE.CanvasTexture(c);
    }

    // direzioni uniformi sulla sfera (Fibonacci) -> spaziatura regolare, niente sovrapposizioni
    function fibDirs(n) {
      const dirs = [], phi = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < n; i++) {
        const y = 1 - ((i + 0.5) / n) * 2;
        const rad = Math.sqrt(Math.max(0, 1 - y * y)), th = phi * i;
        dirs.push(new THREE.Vector3(Math.cos(th) * rad, y, Math.sin(th) * rad));
      }
      return dirs;
    }

    // costruisce scena 360, foto reveal, campagne attorno e CTA 3D — sul renderer dato
    async function buildWorld(rnd) {
      renderer = rnd;
      worldScene = new THREE.Scene();
      worldScene.background = null;                  // trasparente durante il burst (si vede la camera)
      worldCam = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
      worldScene.add(new THREE.AmbientLight(0xffffff, 0.95));
      const dl = new THREE.DirectionalLight(0xffffff, 0.75); dl.position.set(0.4, 1, 1.4); worldScene.add(dl);

      // gruppo centrale: foto + CTA fluttuano INSIEME
      centerGroup = new THREE.Group();
      worldScene.add(centerGroup);

      // --- foto rivelata (planare, stabile) con deblur shader ---
      const tex = new THREE.TextureLoader().load(SHARP_IMG);
      tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = true;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;
      revealMat = new THREE.ShaderMaterial({
        uniforms: { map:{value:tex}, uBias:{value:4.5} },
        vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
        fragmentShader: `uniform sampler2D map; uniform float uBias; varying vec2 vUv;
          void main(){ vec4 c=texture2D(map,vUv,uBias); vec3 lin=pow(c.rgb,vec3(2.2)); gl_FragColor=vec4(lin,1.0);} `,
      });
      photoMesh = new THREE.Mesh(new THREE.PlaneGeometry(PHOTO_W, PHOTO_W * 0.625), revealMat);
      photoMesh.position.set(0, 0, -D_PHOTO);
      photoMesh.visible = false;                     // appare dopo il burst
      centerGroup.add(photoMesh);

      // glow 3D dai bordi della foto che si proietta verso la camera (transizione)
      glowMesh = new THREE.Mesh(new THREE.PlaneGeometry(PHOTO_W, PHOTO_W * 0.625),
        new THREE.MeshBasicMaterial({ map: makeEdgeGlowTex(), transparent:true, opacity:0,
          blending: THREE.AdditiveBlending, depthTest:false, depthWrite:false }));
      glowMesh.position.set(0, 0, -D_PHOTO); glowMesh.renderOrder = 50; glowMesh.visible = false;
      worldScene.add(glowMesh);

      // --- campagne d'archivio: distribuzione uniforme sul 360, fluttuanti e cliccabili ---
      const pool = await loadCampaignPool();
      const dirs = fibDirs(Math.ceil(N_CAMPAIGNS * 1.5));   // extra per scartare il cono frontale
      let placed = 0, di = 0;
      while (placed < N_CAMPAIGNS && di < dirs.length && placed < pool.length) {
        const dir = dirs[di++];
        if (dir.z < -0.80) continue;                          // libera il cono della foto (fronte = -Z)
        const it = pool[placed];
        const base = dir.clone().multiplyScalar(CAMP_R + (Math.random() - 0.5) * 0.4);
        const mat = new THREE.MeshBasicMaterial({ transparent:true, opacity:0 });
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
        mesh.position.copy(base);
        mesh.lookAt(0, 0, 0);
        let hh = 0.9 + Math.random() * 0.35;
        const maxd = Math.max(hh * it.a, hh);
        if (maxd > 1.9) hh *= 1.9 / maxd;                     // limita la dimensione -> niente sovrapposizioni
        mesh.scale.set(hh * it.a, hh, 1);
        mesh.userData = {
          stem: it.stem, base: base.clone(), baseQuat: mesh.quaternion.clone(),
          phase: Math.random() * Math.PI * 2, speed: 0.25 + Math.random() * 0.45,
          amp: 0.08 + Math.random() * 0.14, rphase: Math.random() * Math.PI * 2, ramp: 0.02 + Math.random() * 0.04,
        };
        loadTex(it.path).then((t) => { if (t) { mat.map = t; mat.needsUpdate = true; } });
        campMats.push(mat); campMeshes.push(mesh); worldScene.add(mesh);
        placed++;
      }
      // la CTA è ora un overlay 2D (#cta): nessuna geometria 3D da costruire
    }

    // adatta renderer/camera al riquadro stage (portrait, senza distorsione)
    function fitRenderer() {
      const r = stage.getBoundingClientRect();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(r.width, r.height, false);
      const cv = renderer.domElement;
      cv.style.objectFit = 'fill'; cv.style.width = '100%'; cv.style.height = '100%';
      worldCam.aspect = r.width / r.height; worldCam.updateProjectionMatrix();
    }
    window.addEventListener('resize', () => { if (phase === 'world') fitRenderer(); });

    // ---------- look-around ----------
    function setQuatFromGyro(q, alpha, beta, gamma, orient) {
      tmpEuler.set(beta, alpha, -gamma, 'YXZ');
      q.setFromEuler(tmpEuler);
      q.multiply(q1);
      q.multiply(tmpQ.setFromAxisAngle(zee, -orient));
    }
    window.addEventListener('deviceorientation', (e) => {
      if (e.alpha == null) return;
      gAlpha = THREE.MathUtils.degToRad(e.alpha);
      gBeta  = THREE.MathUtils.degToRad(e.beta || 0);
      gGamma = THREE.MathUtils.degToRad(e.gamma || 0);
      gOrient = THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
      gyroActive = true;
    });
    function updateLook() {
      if (previewMode) {                                   // desktop: lenta auto-rotazione per mostrare il 360
        yaw += 0.0022; tmpEuler.set(0, yaw, 0, 'YXZ'); worldCam.quaternion.setFromEuler(tmpEuler); return;
      }
      if (gyroActive) {                                    // mobile: SOLO giroscopio
        setQuatFromGyro(curQ, gAlpha, gBeta, gGamma, gOrient);
        if (!gyroRefInv) gyroRefInv = curQ.clone().invert();   // allinea il "davanti" alla foto
        worldCam.quaternion.copy(curQ).multiply(gyroRefInv);
      }
      // senza giroscopio resta frontale (niente drag)
    }
    stage.addEventListener('pointerdown', (e) => {
      if (phase !== 'world') return;
      isDrag = false; downX = e.clientX; downY = e.clientY;
    });
    stage.addEventListener('pointermove', (e) => {
      if (phase !== 'world') return;
      if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 10) isDrag = true;  // distingue tap da swipe
    });
    stage.addEventListener('pointerup', (e) => {
      if (phase !== 'world') return;
      if (!isDrag) tapTest(e.clientX, e.clientY);   // tap fermo = click su CTA / campagna
    });
    function tapTest(cx, cy) {
      const r = stage.getBoundingClientRect();
      const ndc = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, worldCam);
      const hit = ray.intersectObjects(campMeshes, false);   // click su una campagna -> item view
      if (hit.length) {
        const stem = hit[0].object.userData.stem;
        window.location.href = `../index.html?archive=1&item=${encodeURIComponent(stem)}`;
      }
    }

    // ---------- transizioni ----------
    function startBurst() {               // riconoscimento -> glow 3D dai bordi della foto verso la camera
      phase = 'burst';
      burstT0 = performance.now();
      if (navigator.vibrate) navigator.vibrate(60);
      ui.hint.classList.add('hide');
      ui.ig.classList.add('dim');
      document.body.classList.add('revealed');
      if (glowMesh) glowMesh.visible = true;   // l'ambiente reale resta visibile: nessun flash bianco generale
    }
    function enterWorld() {                // dal glow alla canvas ancorata all'ambiente reale
      phase = 'world';
      worldT0 = performance.now();
      // niente più mondo bianco: sfondo trasparente -> il feed camera (ambiente) resta dietro.
      // la canvas è ancorata alle coordinate fisiche della foto scansionata (davanti all'utente).
      worldScene.background = previewMode ? new THREE.Color(0xffffff) : null;
      if (glowMesh) glowMesh.visible = false;
      if (photoMesh) photoMesh.visible = true;
      fitRenderer();
      setTimeout(() => { ui.lookhint.classList.add('show');
        setTimeout(() => ui.lookhint.classList.remove('show'), 3200); }, 600);
    }

    // ---------- loop ----------
    function startLoop() {
      renderer.setAnimationLoop((now) => {
        if (phase === 'world') {
          const wt = now - worldT0;
          revealMat.uniforms.uBias.value = 4.5 * (1 - easeOutCubic(clamp01(wt / DEBLUR_MS)));  // deblur
          const cf = easeOutCubic(clamp01(wt / 900));
          for (const m of campMats) m.opacity = cf * 0.95;                                      // campagne fade-in
          const ts = now * 0.001;
          if (centerGroup) {                                                                   // foto + CTA fluttuano insieme
            centerGroup.position.set(Math.cos(ts * 0.42) * 0.03, Math.sin(ts * 0.55) * 0.05, 0);
            centerGroup.rotation.set(Math.sin(ts * 0.42) * 0.010, 0, Math.sin(ts * 0.50) * 0.012);
          }
          for (const mh of campMeshes) {                                                       // campagne che fluttuano
            const u = mh.userData;
            mh.position.y = u.base.y + Math.sin(ts * u.speed + u.phase) * u.amp;
            mh.position.x = u.base.x + Math.cos(ts * u.speed * 0.8 + u.phase) * u.amp * 0.5;
            mh.quaternion.copy(u.baseQuat).multiply(tmpQ2.setFromAxisAngle(zee, Math.sin(ts * u.speed + u.rphase) * u.ramp));
          }
          if (!ctaShown && wt > DEBLUR_MS + CTA_GAP) {   // riemerge la CTA 2D (font Klein Book)
            ctaShown = true; ui.cta.classList.add('show');
          }
          updateLook();
          renderer.render(worldScene, worldCam);
        } else if (phase === 'burst') {
          const bt = now - burstT0, e = easeOutCubic(clamp01(bt / BURST_MS));
          glowMesh.material.opacity = Math.sin(Math.PI * clamp01(e));   // pulse: sale dai bordi e svanisce
          glowMesh.position.z = -D_PHOTO + (D_PHOTO - 0.25) * e;         // i bordi si proiettano verso la camera
          glowMesh.scale.setScalar(1 + e * 1.6);                        // si espande dai margini (niente whiteout)
          updateLook();
          renderer.render(worldScene, worldCam);                   // bg trasparente -> camera dietro + bagliore
          if (bt >= BURST_MS) enterWorld();
        } else if (scanScene) {
          renderer.render(scanScene, scanCam);                     // scan: feed visibile
        }
      });
    }
    let scanCam = null;

    // ---------- avvio ----------
    async function startAR() {
      const mindar = new MindARThree({
        container: $('ar'), imageTargetSrc: MIND_URL,
        uiScanning: 'no', uiLoading: 'no', uiError: 'no',
      });
      scanScene = mindar.scene; scanCam = mindar.camera;
      const anchor = mindar.addAnchor(0);
      anchor.onTargetFound = () => {
        if (phase !== 'scan') return;
        phase = 'recognized';                 // blocca ri-trigger durante l'attesa
        if (navigator.vibrate) navigator.vibrate(30);
        setTimeout(() => { if (phase === 'recognized') startBurst(); }, RECOG_DELAY);
      };
      await buildWorld(mindar.renderer);
      startLoop();
      await mindar.start();
    }

    async function startPreview() {        // desktop: stesso mondo, senza camera (auto-rotazione)
      ui.gate.classList.remove('on');
      ui.ig.classList.add('dim');
      ui.whiteout.style.opacity = '1';
      previewMode = true;
      const rnd = new THREE.WebGLRenderer({ antialias:true });
      rnd.setSize(stage.clientWidth, stage.clientHeight);
      $('ar').appendChild(rnd.domElement);
      await buildWorld(rnd);
      startLoop();
      enterWorld();
    }
    ui.demoAlt.addEventListener('click', startPreview);

    // fallback: il permesso giroscopio si chiede già al tap su "Prova il filtro" (index.html);
    // se non fosse passato, lo richiediamo al primo tocco nella camera (iOS richiede un gesto).
    window.addEventListener('touchstart', function once() {
      window.removeEventListener('touchstart', once);
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function' && !gyroActive) {
        DeviceOrientationEvent.requestPermission().catch(() => {});
      }
    }, { passive: true });

    function init() {
      if (!isMobileDevice()) { ui.ig.style.display = 'none'; ui.gate.classList.add('on'); return; }
      setTimeout(() => { if (phase === 'scan') ui.hint.classList.add('hide'); }, 4000);
      startAR().catch((e) => {
        ui.hint.textContent = "Consenti l'accesso alla fotocamera, poi ricarica.";
        ui.hint.classList.remove('hide'); console.error('AR error:', e);
      });
    }
    init();
  </script>
</body>
</html>
