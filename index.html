<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calvin Klein Archive | Digital Collection</title>
    <meta name="description" content="Digital archive of Calvin Klein's historical collections and advertisements. A UX-UI academic project for IUAD.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="minimal-nav">
        <div class="logo">CK ARCHIVE</div>
        <div class="links">
            <a href="#collections" style="color: inherit; text-decoration: none; margin-left: 2rem;">COLLECTIONS</a>
            <a href="#about" style="color: inherit; text-decoration: none; margin-left: 2rem;">ABOUT</a>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h1 class="reveal">Eternity<br>Defined</h1>
            <p class="reveal" style="max-width: 400px; margin-top: 2rem; font-size: 1.1rem; opacity: 0.8;">
                Exploring the visual legacy of Calvin Klein through decades of minimalism, provocation, and pure aesthetic.
            </p>
            <div class="hero-image-container reveal">
                <img src="hero.png" alt="Calvin Klein Aesthetic Hero Image">
            </div>
        </section>

        <section id="collections" class="archive-grid">
            <!-- Items will be populated or static for now -->
            <div class="grid-item">
                <img src="hero.png" alt="Collection 1" style="filter: brightness(0.8);">
                <div class="grid-item-info">
                    <h3>1994 Fall/Winter</h3>
                    <p>Minimalist Semiotics</p>
                </div>
            </div>
            <div class="grid-item">
                <img src="hero.png" alt="Collection 2" style="filter: brightness(0.7);">
                <div class="grid-item-info">
                    <h3>1992 Campaign</h3>
                    <p>The Kate Era</p>
                </div>
            </div>
            <div class="grid-item">
                <img src="hero.png" alt="Collection 3" style="filter: brightness(0.6);">
                <div class="grid-item-info">
                    <h3>2000s Transition</h3>
                    <p>Modern Lines</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
